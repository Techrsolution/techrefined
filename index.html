<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Hub</title>
<style>
:root{--bg:#0e1116;--card:#171c24;--line:#262d38;--tx:#e7ecf3;--mu:#8b97a8;--ac:#ff444f;--gr:#2ecc71;--rd:#ff5c66;--bl:#3b82f6}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header b{font-size:17px}
.hr{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rd);margin-right:6px}
.dot.on{background:var(--gr)}
.wrap{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 54px)}
nav{border-right:1px solid var(--line);padding:12px 8px}
nav a{display:block;padding:10px 12px;margin-bottom:4px;border-radius:8px;color:var(--mu);text-decoration:none}
nav a.on{background:var(--card);color:var(--tx);border-left:3px solid var(--ac)}
main{padding:16px;min-width:0}
.page{display:none}.page.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:24px;font-weight:700}
.mu{color:var(--mu);font-size:13px}
.g{color:var(--gr)}.r{color:var(--rd)}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:10px}
input,select{display:block;width:100%;margin-top:4px;padding:9px;border-radius:8px;border:1px solid var(--line);background:#0e1116;color:var(--tx);font-size:15px}
button,.btn{background:var(--ac);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
button.alt,.btn.alt{background:#2a3342}
button.green{background:#1faa59}
button:disabled{opacity:.5}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bars{display:flex;gap:6px;align-items:flex-end;height:150px;margin:10px 0}
.bar{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
